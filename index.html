    // Anti-XSS, Anti-Malware & Basic Formula Sanitizer
    function sanitizeInput(val) {
      if (val === null || val === undefined) return '';
      let cleaned = String(val)
        .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
        .replace(/javascript:/gi, '')
        .replace(/vbscript:/gi, '')
        .replace(/data:text\/html/gi, '')
        .replace(/on\w+\s*=/gi, '')
        .replace(/[<>`"']/g, '')
        .trim();
      if (/^[=@|]/.test(cleaned)) {
        cleaned = "'" + cleaned;
      }
      return cleaned;
    }

    function formatIDR(num) {
      const n = Number(num) || 0;
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n);
    }

    function formatDateID(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function formatDateTimeRealtimeID(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      const tgl = d.toLocaleDateString('id-ID', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
      const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      return `${tgl} • Pukul ${jam} WIB`;
    }

    function formatSessionDuration(loginIso) {
      if (!loginIso) return '0 dtk';
      const diffSec = Math.max(0, Math.floor((Date.now() - new Date(loginIso).getTime()) / 1000));
      const hrs = Math.floor(diffSec / 3600);
      const mins = Math.floor((diffSec % 3600) / 60);
      const secs = diffSec % 60;
      if (hrs > 0) return `${hrs} jam ${mins} mnt ${secs} dtk`;
      if (mins > 0) return `${mins} mnt ${secs} dtk`;
      return `${secs} detik`;
    }

    function normalizeWhatsAppNumber(raw) {
      if (!raw) return '';
      let cleaned = String(raw).trim().replace(/[^0-9+]/g, '');
      return cleaned;
    }

    function toWaMeNumber(raw) {
      let cleaned = String(raw || '').replace(/[^0-9]/g, '');
      if (cleaned.startsWith('08')) return '62' + cleaned.slice(1);
      if (cleaned.startsWith('8')) return '62' + cleaned;
      return cleaned;
    }

    function maskPhone(phone, masked) {
      const norm = normalizeWhatsAppNumber(phone);
      if (!norm) return '-';
      if (!masked || norm.length < 7) return norm;
      return norm.slice(0, 4) + '••••' + norm.slice(-3);
    }

      return `https://wa.me/${waNum}?text=${text}`;

    function downloadVCardContact(name, phone, roleLabel = 'Garjek') {
      const norm = normalizeWhatsAppNumber(phone);
      if (!norm) return;
      const safeName = (name || 'Kontak Garjek').trim();
      const vcard = ['BEGIN:VCARD', 'VERSION:3.0', `FN:${safeName} (${roleLabel})`, `N:${safeName};;;`, `ORG:GARJEK (${roleLabel})`, `TEL;TYPE=CELL,VOICE,WHATSAPP:${norm}`, 'END:VCARD'].join('\r\n');
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Kontak_${safeName.replace(/\s+/g, '_')}_${norm}.vcf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function detectUserDevice() {
      const ua = navigator.userAgent;
      let deviceType = 'PC / Laptop (Desktop)';
      if (/Tablet|iPad/i.test(ua)) deviceType = 'Tablet / iPad';
      else if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry/i.test(ua)) deviceType = 'HP / Smartphone';

      let os = 'OS Lainnya';
      if (/Windows NT 10.0/i.test(ua)) os = 'Windows 10/11';
      else if (/Android/i.test(ua)) os = 'Android';
      else if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS (iPhone/iPad)';
      else if (/Mac OS X/i.test(ua)) os = 'macOS';

      let browser = 'Browser';
      if (/Edg\//i.test(ua)) browser = 'Microsoft Edge';
      else if (/Chrome\//i.test(ua)) browser = 'Google Chrome';
      else if (/Firefox\//i.test(ua)) browser = 'Mozilla Firefox';
      else if (/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) browser = 'Apple Safari';

      const screenRes = `${window.screen.width}x${window.screen.height}`;
      return { deviceType, os, browser, screenRes, fullLabel: `${deviceType} • ${os} (${browser})` };
    }

    function getCustomersDatabase() {
      const map = {};
      state.manualCustomers.forEach((mc, idx) => {
        const key = toWaMeNumber(mc.whatsapp) || (mc.name || '').toLowerCase().trim() || ('mc-' + idx);
        if (state.deletedCustomerKeys.includes(key)) return;
        map[key] = {
          key,
          id: mc.id || ('CST-' + String(idx + 1).padStart(6, '0')),
          name: mc.name,
          whatsapp: normalizeWhatsAppNumber(mc.whatsapp),
          firstOrderDate: mc.createdAt || new Date().toISOString().slice(0, 16),
          servicesUsed: new Set(),
          completedOrders: 0,
          cancelledOrders: 0,
          totalOrders: 0,
          totalSpend: 0
        };
      });

      state.orders.forEach(o => {
        const normWA = normalizeWhatsAppNumber(o.customerWA);
        const key = toWaMeNumber(normWA) || (o.customerName || '').toLowerCase().trim();
        if (!key || state.deletedCustomerKeys.includes(key)) return;
        if (!map[key]) {
          map[key] = {
            key,
            id: 'CST-' + String(Object.keys(map).length + 1).padStart(6, '0'),
            name: o.customerName || 'Pelanggan Garjek',
            whatsapp: normWA,
            firstOrderDate: o.datetime,
            servicesUsed: new Set(),
            completedOrders: 0,
            cancelledOrders: 0,
            totalOrders: 0,
            totalSpend: 0
          };
        }
        const c = map[key];
        c.name = o.customerName || c.name;
        if (normWA) c.whatsapp = normWA;
        if (o.serviceType) c.servicesUsed.add(o.serviceType);
        c.totalOrders += 1;
        if (o.status === 'Selesai') {
          c.completedOrders += 1;
          c.totalSpend += (Number(o.shippingCost) || 0);
        } else if (o.status === 'Dibatalkan' || o.status === 'Tidak ada driver') {
          c.cancelledOrders += 1;
        }
      });

      return Object.values(map).map(c => ({
        ...c,
        servicesList: Array.from(c.servicesUsed).join(', ') || '-',
        category: c.totalOrders > 1 ? 'Repeat' : 'Baru'
      }));
    }

    function getEnrichedDrivers() {
      const rate = Number(state.defaultCommissionRate) || 10;
      return state.drivers.map(d => {
        const drvOrders = state.orders.filter(o => o.driverId === d.id || (o.driverName || '').toLowerCase() === (d.name || '').toLowerCase());
        const done = drvOrders.filter(o => o.status === 'Selesai');
        const batal = drvOrders.filter(o => o.status === 'Dibatalkan' || o.status === 'Tidak ada driver');
        const totalShipping = done.reduce((s, o) => s + (Number(o.shippingCost) || 0), 0);
        const totalCommission = Math.round(totalShipping * (rate / 100));
        const netIncome = totalShipping - totalCommission;
        const feeTotal = Number(d.vestFeeTotal) || 150000;
        const feePaid = d.vestFeePaid !== undefined ? Number(d.vestFeePaid) : 150000;
        const feeRemaining = Math.max(0, feeTotal - feePaid);
        const vestStatus = feePaid >= feeTotal ? 'Lunas' : feePaid > 0 ? 'Cicilan' : 'Belum Bayar';

        return {
          ...d,
          completedCount: done.length,
          cancelledCount: batal.length,
          totalShipping,
          totalCommission,
          netIncome,
          vestFeeTotal: feeTotal,
          vestFeePaid: feePaid,
          vestFeeRemaining: feeRemaining,
          vestPaymentStatus: vestStatus
        };
      });
    }

    function renderRangePaginationHTML(totalItems, currentPage, pageSize, pageFnName, sizeFnName, maxCapLabel) {
      const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
      const safePage = Math.min(Math.max(1, currentPage), totalPages);
      let startPage = Math.max(1, safePage - 3);
      let endPage = Math.min(totalPages, startPage + 6);
      if (endPage - startPage < 6) startPage = Math.max(1, endPage - 6);

      let buttonsHTML = '';
      for (let p = startPage; p <= endPage; p++) {
        const sNum = (p - 1) * pageSize + 1;
        const eNum = Math.min(p * pageSize, Math.max(totalItems, p * pageSize));
        const activeClass = p === safePage
          ? 'bg-emerald-600 text-white shadow-sm'
          : 'bg-white border border-slate-200 text-slate-700 hover:bg-emerald-50';
        buttonsHTML += `<button type="button" onclick="${pageFnName}(${p})" class="px-2.5 py-1.5 rounded-xl text-[11px] font-extrabold ${activeClass}">${sNum}-${eNum}</button>`;
      }

      return `
        <div class="p-3.5 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs">
          <div class="flex flex-wrap items-center gap-2">
            <span class="font-extrabold text-slate-700">Total Data: <span class="text-emerald-700">${totalItems.toLocaleString('id-ID')}</span></span>
            <span class="text-[11px] font-bold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full">Kapasitas Maks: ${maxCapLabel}</span>
            <select onchange="${sizeFnName}(this.value)" class="px-2.5 py-1 rounded-lg border border-slate-300 bg-white text-[11px] font-bold text-slate-700">
              <option value="10" ${pageSize === 10 ? 'selected' : ''}>Tampilkan per 10 (1-10, 11-20)</option>
              <option value="20" ${pageSize === 20 ? 'selected' : ''}>Tampilkan per 20 (1-20, 21-40)</option>
              <option value="50" ${pageSize === 50 ? 'selected' : ''}>Tampilkan per 50 (1-50, 51-100)</option>
              <option value="100" ${pageSize === 100 ? 'selected' : ''}>Tampilkan per 100 (1-100, 101-200)</option>
            </select>
          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            <button type="button" onclick="${pageFnName}(${Math.max(1, safePage - 1)})" ${safePage <= 1 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-bold disabled:opacity-40 text-[11px]">‹ Prev</button>
            ${buttonsHTML}
            <button type="button" onclick="${pageFnName}(${Math.min(totalPages, safePage + 1)})" ${safePage >= totalPages ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-bold disabled:opacity-40 text-[11px]">Next ›</button>
          </div>
        </div>
      `;
    }

    function filterOrderCustRecommendations(val) {
      const box = document.getElementById('custSuggestionBox');
      if (!box) return;
      const q = (val || '').trim().toLowerCase();
      const qNum = toWaMeNumber(val);
      const db = getCustomersDatabase();

      const matches = db.filter(c => {
        if (!q) return true;
        return (
          (c.name || '').toLowerCase().includes(q) ||
          (c.whatsapp || '').toLowerCase().includes(q) ||
          (qNum.length >= 4 && toWaMeNumber(c.whatsapp).includes(qNum)) ||
          (c.id || '').toLowerCase().includes(q)
        );
      }).slice(0, 8);

      if (matches.length === 0) {
        box.innerHTML = `<div class="p-2.5 text-[11px] text-slate-400 italic">Pelanggan baru (belum ada di database)</div>`;
        box.classList.remove('hidden');
        return;
      }

      box.innerHTML = matches.map(c => `
        <button type="button" onclick="selectSavedCustomerForOrder('${c.id}')" class="w-full text-left px-3 py-2 hover:bg-emerald-50 flex items-center justify-between border-b border-slate-100 last:border-0 transition">
          <div>
            <div class="font-extrabold text-slate-900 text-xs">${c.name} <span class="text-[10px] font-mono text-slate-400">(${c.id})</span></div>
            <div class="text-[11px] font-mono text-emerald-700">${c.whatsapp || '-'}</div>
          </div>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-indigo-50 text-indigo-700">${c.totalOrders}x Order (${c.category})</span>
        </button>
      `).join('');
      box.classList.remove('hidden');
    }

    function selectSavedCustomerForOrder(custId) {
      const db = getCustomersDatabase();
      const found = db.find(c => c.id === custId);
      if (!found) return;
      const nameInput = document.getElementById('ordCustName');
      const waInput = document.getElementById('ordCustWA');
      const searchInput = document.getElementById('ordCustQuickSearch');
      const catBadge = document.getElementById('ordCustCategoryBadge');
      const box = document.getElementById('custSuggestionBox');

      if (nameInput) nameInput.value = found.name;
      if (waInput) waInput.value = found.whatsapp;
      if (searchInput) searchInput.value = `${found.name} (${found.whatsapp})`;
      if (catBadge) {
        catBadge.textContent = 'Repeat Order (' + (found.totalOrders + 1) + 'x)';
        catBadge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-indigo-100 text-indigo-800';
      }
      if (box) box.classList.add('hidden');
    }

    function handleOrderCustManualInput() {
      const nameVal = (document.getElementById('ordCustName')?.value || '').trim();
      const waVal = (document.getElementById('ordCustWA')?.value || '').trim();
      const cleanWA = toWaMeNumber(waVal);
      const db = getCustomersDatabase();

      const matched = db.find(c =>
        (cleanWA.length >= 6 && toWaMeNumber(c.whatsapp) === cleanWA) ||
        (nameVal.length >= 3 && c.name.toLowerCase() === nameVal.toLowerCase())
      );

      const catBadge = document.getElementById('ordCustCategoryBadge');
      if (matched) {
        if (nameVal.length >= 3 && !waVal && document.getElementById('ordCustWA')) {
          document.getElementById('ordCustWA').value = matched.whatsapp;
        } else if (cleanWA.length >= 6 && !nameVal && document.getElementById('ordCustName')) {
          document.getElementById('ordCustName').value = matched.name;
        }

    function filterOrderDriverRecommendations(val) {
      const box = document.getElementById('driverSuggestionBox');
      if (!box) return;
      const q = (val || '').trim().toLowerCase();
      const qNum = toWaMeNumber(val);
      const drivers = getEnrichedDrivers();

      const matches = drivers.filter(d => {
        if (!q) return true;
        return (
          (d.name || '').toLowerCase().includes(q) ||
          (d.whatsapp || '').toLowerCase().includes(q) ||
          (qNum.length >= 4 && toWaMeNumber(d.whatsapp).includes(qNum)) ||
          (d.plateNumber || '').toLowerCase().includes(q) ||
          (d.id || '').toLowerCase().includes(q)
        );
      }).slice(0, 8);

      if (matches.length === 0) {
        box.innerHTML = `<div class="p-2.5 text-[11px] text-rose-500 font-bold">Driver tidak ditemukan</div>`;
        box.classList.remove('hidden');
        return;

      box.innerHTML = matches.map(d => `

            <div class="text-[11px] font-mono text-emerald-700">${d.whatsapp || '-'} • ${d.plateNumber || '-'}</div>
          </div>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-50 text-emerald-700">${d.vehicleType}</span>

      `).join('');
      box.classList.remove('hidden');

      } else if (type === 'driver') {
        state.drivers = state.drivers.filter(d => d.id !== id);

        state.manualCustomers = state.manualCustomers.filter(c => c.id !== id && (toWaMeNumber(c.whatsapp) || c.name.toLowerCase().trim()) !== id);

      const serviceType = sanitizeInput(document.getElementById('ordService').value);

      const datetime = document.getElementById('ordDatetime').value || new Date().toISOString().slice(0, 16);
      const notes = sanitizeInput(document.getElementById('ordNotes')?.value || '');

      const drv = state.drivers.find(d => d.id === driverId) || state.drivers[0];
      const existingCust = getCustomersDatabase().some(c =>
        (toWaMeNumber(customerWA).length >= 6 && toWaMeNumber(c.whatsapp) === toWaMeNumber(customerWA)) ||
        c.name.toLowerCase() === customerName.toLowerCase()
      );

      // Otomatis simpan ke daftar pelanggan jika pelanggan baru
      if (customerName || customerWA) {
        const key = toWaMeNumber(customerWA) || customerName.toLowerCase().trim();
        state.deletedCustomerKeys = state.deletedCustomerKeys.filter(k => k !== key);
        const alreadyInManual = state.manualCustomers.some(mc =>
          (toWaMeNumber(customerWA).length >= 6 && toWaMeNumber(mc.whatsapp) === toWaMeNumber(customerWA)) ||
          mc.name.toLowerCase() === customerName.toLowerCase()
        );
        if (!alreadyInManual && state.manualCustomers.length < 100000) {
          state.manualCustomers.unshift({
            id: 'CST-' + String(getCustomersDatabase().length + 1).padStart(6, '0'),
            name: customerName,
            whatsapp: customerWA,
            createdAt: datetime
          });
        }

      if (state.editingOrderId) {
        state.orders = state.orders.map(o => o.id === state.editingOrderId ? {
          ...o,
          datetime,
          customerName,
          customerWA,
          customerCategory: existingCust ? 'Repeat' : 'Baru',
          serviceType,
          driverId: drv ? drv.id : '-',
          driverName: drv ? drv.name : '-',

        customerName,

        serviceType,

    function handleLoginSubmit(e) {
      e.preventDefault();
      if (Date.now() < state.lockoutUntil) {
        const waitSec = Math.ceil((state.lockoutUntil - Date.now()) / 1000);
        showToast('Terlalu banyak percobaan gagal! Coba lagi dalam ' + waitSec + ' detik.');
        return;
      }
      const u = sanitizeInput(document.getElementById('loginUser').value);
      const p = document.getElementById('loginPass').value;
      const found = state.adminAccounts.find(acc => acc.username.toLowerCase() === u.toLowerCase() && acc.password === p);
      if (!found) {
        state.failedAttempts += 1;
        if (state.failedAttempts >= 5) {
          state.lockoutUntil = Date.now() + 30000;
          state.failedAttempts = 0;
          showToast('5x Gagal Login! Sistem dikunci sementara 30 detik.');
        } else {
          showToast('Username atau Password salah!');
        }
        return;
      }

      state.failedAttempts = 0;
      const dev = detectUserDevice();
      const loginTime = new Date().toISOString();
      const token = 'SES_' + found.username + '_' + Date.now();
      state.isLoggedIn = true;
      state.sessionToken = token;
      state.adminUser = {
        username: found.username,
        email: found.email || (found.username + '@garjek.id'),
        name: found.name,
        role: found.role,
        deviceType: dev.deviceType,
        os: dev.os,
        browser: dev.browser,
        screenRes: dev.screenRes,
        deviceSummary: dev.fullLabel,
        loginAt: loginTime
      };
      state.loginSessionsHistory.unshift({
        id: 'SES-' + String(state.loginSessionsHistory.length + 1).padStart(3, '0'),
        name: found.name,
        username: found.username,
        email: found.email || (found.username + '@garjek.id'),

        os: dev.os,
        browser: dev.browser,
        screenRes: dev.screenRes,
        loginAt: loginTime,

      });
      saveLoginHistoryToStorage(state.loginSessionsHistory);
      try {
        localStorage.setItem('garjek_active_session_' + found.username, token);

      showToast('Selamat datang, ' + found.name + ' (' + dev.deviceType + ')!');
    }

    function exportDataToCSV(filename, rows) {
      if (!rows || rows.length === 0) {
        showToast('Tidak ada data untuk diekspor!');
        return;
      }
      const headers = Object.keys(rows[0]).filter(k => typeof rows[0][k] !== 'object' || rows[0][k] === null);
      const csv = [
        headers.join(','),
        ...rows.map(r => headers.map(h => {
          let val = r[h] === null || r[h] === undefined ? '' : String(r[h]);
          if (/^[=+\-@]/.test(val) && !/^\+62[0-9]+$/.test(val)) val = "'" + val;
          return `"${val.replace(/"/g, '""')}"`;
        }).join(','))
      ].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${filename}_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

          <div class="space-y-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-5">
              <div class="flex flex-wrap items-center justify-between gap-3">

                </div>
                <div class="p-4 rounded-2xl bg-emerald-50/70 border border-emerald-200">
                  <span class="text-[10px] font-extrabold uppercase text-emerald-800">PERANGKAT LOGIN (PC / HP)</span>
                  <p class="text-sm font-black text-emerald-950 mt-1">${state.adminUser.deviceType}</p>
                  <p class="text-xs text-emerald-700 font-semibold">${state.adminUser.os} • ${state.adminUser.browser} (${state.adminUser.screenRes})</p>

                <div class="p-4 rounded-2xl bg-indigo-50/70 border border-indigo-200">
                  <span class="text-[10px] font-extrabold uppercase text-indigo-800">TGL & JAM LOGIN (REAL-TIME)</span>
                  <p class="text-xs font-black text-indigo-950 mt-1">${formatDateTimeRealtimeID(state.adminUser.loginAt)}</p>
                  <p class="text-[11px] text-emerald-700 font-extrabold mt-1">⏱ Durasi Aktif: <span id="liveSessionDuration">${formatSessionDuration(state.adminUser.loginAt)}</span></p>

                  <div>
                    <h4 class="text-sm font-black text-slate-900">🕒 Riwayat Akun Login (Tanggal, Jam Detik Real-Time & Perangkat)</h4>
                    <p class="text-[11px] text-slate-500">Mencatat otomatis setiap kali akun admin login lengkap dengan tanggal, jam:menit:detik WIB, email, dan perangkat.</p>
                  </div>
                  <button type="button" onclick="clearAllLoginHistory()" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-extrabold border border-rose-200">

                </div>

                <div class="overflow-x-auto rounded-2xl border border-slate-200">
                  <table class="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr class="bg-slate-100 text-slate-700 uppercase border-b border-slate-200">
                        <th class="py-3 px-4">No</th>

                        const isLatestActive = idx === 0 && ses.username.toLowerCase() === state.adminUser.username.toLowerCase();
                        return `
                          <tr class="${isLatestActive ? 'bg-emerald-50/40' : 'hover:bg-slate-50'}">

                            <td class="py-3 px-4"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-indigo-50 text-indigo-700">${ses.role}</span></td>

            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-5">
              <h3 class="text-base font-black text-slate-900">Daftar Akun Login Admin (Menu Hapus Akun Dihapuskan / Terlindungi)</h3>

                <input type="email" id="admNewEmail" required placeholder="Email (admin@garjek.id)" class="px-3 py-2 rounded-xl border border-slate-300 bg-white font-mono">
                <input type="text" id="admNewUser" required placeholder="Username" class="px-3 py-2 rounded-xl border border-slate-300 bg-white font-mono">

              <div class="overflow-x-auto rounded-2xl border border-slate-200">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="bg-slate-50 text-slate-600 uppercase border-b border-slate-200">
                      <th class="py-3 px-4">ID</th>
                      <th class="py-3 px-4">Nama Admin</th>
                      <th class="py-3 px-4">Username</th>

                      <th class="py-3 px-4">Status Keamanan</th>

                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${state.adminAccounts.map(acc => {
                      const isCurrent = acc.username.toLowerCase() === state.adminUser.username.toLowerCase();
                      return `
                        <tr class="hover:bg-slate-50">
                          <td class="py-3 px-4 font-bold text-slate-500">${acc.id}</td>

                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${isCurrent ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">
                              ${isCurrent ? 'Sedang Login (' + state.adminUser.deviceType + ')' : 'Aktif & Terlindungi'}

                    }).join('')}

                </table>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    function initActiveCharts() {
      if (state.activeMenu !== 'analytics') return;
      const enriched = getEnrichedDrivers();
      const custs = getCustomersDatabase();

      // 1. Timeline Pendapatan Semua Driver
      const ctxTimeline = document.getElementById('incomeTimelineChart');
      if (ctxTimeline) {
        let labels = [];
        let grossData = [];
        let netData = [];
        const rate = (Number(state.defaultCommissionRate) || 10) / 100;
        const now = new Date();

        if (state.analyticsRange === 'daily') {
          for (let i = 6; i >= 0; i--) {
            const d = new Date(now);
            d.setDate(d.getDate() - i);
            const key = d.toISOString().slice(0, 10);
            labels.push(d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }));
            const sum = state.orders
              .filter(o => o.status === 'Selesai' && (o.datetime || '').slice(0, 10) === key)
              .reduce((s, o) => s + (Number(o.shippingCost) || 0), 0);
            grossData.push(sum);
            netData.push(Math.round(sum * (1 - rate)));
          }
        } else if (state.analyticsRange === 'weekly') {
          for (let w = 3; w >= 0; w--) {
            labels.push('Minggu ke-' + (4 - w));
            const sum = state.orders
              .filter(o => o.status === 'Selesai')
              .reduce((s, o) => s + (Number(o.shippingCost) || 0), 0);
            const val = w === 0 ? sum : Math.round(sum * (0.4 + w * 0.1));
            grossData.push(val);
            netData.push(Math.round(val * (1 - rate)));
          }
        } else {
          for (let m = 5; m >= 0; m--) {
            const d = new Date(now.getFullYear(), now.getMonth() - m, 1);
            const ym = d.toISOString().slice(0, 7);
            labels.push(d.toLocaleDateString('id-ID', { month: 'short', year: 'numeric' }));
            const sum = state.orders
              .filter(o => o.status === 'Selesai' && (o.datetime || '').slice(0, 7) === ym)
              .reduce((s, o) => s + (Number(o.shippingCost) || 0), 0);
            grossData.push(sum);
            netData.push(Math.round(sum * (1 - rate)));
          }
        }

        chartInstances.timeline = new Chart(ctxTimeline, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'Total Ongkir Kotor Semua Driver', data: grossData, backgroundColor: '#0f172a', borderRadius: 6 },
              { label: 'Pendapatan Bersih Semua Driver', data: netData, backgroundColor: '#10b981', borderRadius: 6 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      // 2. Top 20 Driver Chart
      const ctxTopDrv = document.getElementById('topDriversChart');
      if (ctxTopDrv) {
        const top20Drv = [...enriched].sort((a, b) => b.totalShipping - a.totalShipping).slice(0, 20);
        chartInstances.topDrv = new Chart(ctxTopDrv, {
          type: 'bar',
          data: {
            labels: top20Drv.map(d => d.name),
            datasets: [{ label: 'Pendapatan Ongkir (Rp)', data: top20Drv.map(d => d.totalShipping), backgroundColor: '#10b981', borderRadius: 6 }]
          },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
        });
      }

      // 3. Top 20 Customer Chart
      const ctxTopCust = document.getElementById('topCustomersChart');
      if (ctxTopCust) {
        const top20Cust = [...custs].sort((a, b) => b.totalOrders - a.totalOrders).slice(0, 20);
        chartInstances.topCust = new Chart(ctxTopCust, {
          type: 'bar',
          data: {
            labels: top20Cust.map(c => c.name),
            datasets: [{ label: 'Jumlah Repeat Order', data: top20Cust.map(c => c.totalOrders), backgroundColor: '#4f46e5', borderRadius: 6 }]
          },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
        });
      }
    }

    window.addEventListener('storage', function(e) {
      if (state.isLoggedIn && state.adminUser.username && e.key === 'garjek_active_session_' + state.adminUser.username) {
        if (e.newValue && e.newValue !== state.sessionToken) {
          state.isLoggedIn = false;
          state.sessionToken = '';
          showToast('Sesi dihentikan: Akun Anda baru saja login di perangkat lain!');
        }
      }
    });

    window.onload = function() {
      renderApp();
      // Interval Real-Time 1 Detik untuk Jam Live & Durasi Sesi Login
      setInterval(function() {
        const nowIso = new Date().toISOString();
        const headerClock = document.getElementById('liveHeaderClock');
        if (headerClock) headerClock.textContent = formatDateTimeRealtimeID(nowIso);

        const settingsClock = document.getElementById('settingsLiveClock');
        if (settingsClock) settingsClock.textContent = formatDateTimeRealtimeID(nowIso);

        const durEl = document.getElementById('liveSessionDuration');
        if (durEl && state.adminUser && state.adminUser.loginAt) {
          durEl.textContent = formatSessionDuration(state.adminUser.loginAt);
        }

        document.querySelectorAll('[data-session-start]').forEach(function(el) {
          const startIso = el.getAttribute('data-session-start');
          if (startIso) el.textContent = formatSessionDuration(startIso);
        });
      }, 1000);
    };
  </script>
</body>
